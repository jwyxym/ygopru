[package]
name = "ygopro"
version = "1.36.2-rs.1"
edition = "2024"

[lib]
name = "ygopro"
path = "src/lib.rs"

[[bin]]
name = "ygopro"
path = "src/main.rs"

[dependencies]
binrw = "0.13"
futures = "0.3"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
tokio-stream = { version = "0.1", features = ["sync"] }
parking_lot = { version = "0", features = ["arc_lock", "send_guard"] }
env_logger = { version = "0.11", features = ["auto-color", "humantime"] }
anymap3 = { version = "1", default-features = false, features = ["hashbrown"] }
base64 = "0.22"
bytes = "1"
log = "0.4"
arc-swap = "1"
hashbrown = "0.17.1"
rand = "0.8"
linkme = "0.3"
glob = "0.3"
slab = "0.4"
zip = { version = "4", optional = true }

ygopro-data.workspace = true
ygopro-core-wrapper = { path = "../ygopro-core-wrapper", default-features = false }
ygopro-handler = { path = "../ygopro-handler", default-features = false }
ygopro-derive = { path = "../ygopro-derive" }

[features]
default = ["zip", "card"]
zip = ["dep:zip"]
card = [
    "ygopro-core-wrapper/card",
    "ygopro-data/card",
    "ygopro-handler/card",
]

[profile.release]
lto = true
strip = true
opt-level = 'z'
