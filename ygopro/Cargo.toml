[package]
name = "ygopro"
version = "0.1.0"
edition = "2024"

[lib]
name = "ygopro"
path = "src/lib.rs"

[dependencies]
binrw = "0.13"
futures = "0.3"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
parking_lot = { version = "0", features = ["arc_lock", "send_guard"] }
bytes = "1"
log = "0.4"
arc-swap = "1"
hashbrown = "0.17.1"
linkme = "0.3"
walkdir = "2.5.0"
glob = "0.3"

zip = { version = "4", optional = true }

ygopro-data = { path = "../ygopro-data" }
ygopro-core-wrapper = { path = "../ygopro-core-wrapper" }
ygopro-handler = { path = "../ygopro-handler" }
ygopro-derive = { path = "../ygopro-derive" }
anymap3 = "1.1.0"

[features]
default = ["zip"]
zip = ["dep:zip"]
ygopro3_support = []
ygomobile_support = []
