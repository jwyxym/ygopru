[package]
name = "ygopro"
version = "0.1.3"
edition.workspace = true
license-file.workspace = true
repository.workspace = true
description = "A Rust rewrite of the YGOPro duel server."
documentation = "https://docs.rs/ygopro"
readme = "README.md"
keywords = ["ygopro"]

[lib]
name = "ygopro"
path = "src/lib.rs"

[[bin]]
name = "ygopro"
path = "src/main.rs"

[dependencies]
binrw = "0.13"
futures = "0.3"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
tokio-stream = { version = "0.1", features = ["sync"] }
parking_lot = { version = "0", features = ["arc_lock", "send_guard"] }
env_logger = { version = "0.11", features = ["auto-color", "humantime"] }
anymap3 = { version = "1", default-features = false, features = ["hashbrown"] }
base64 = "0.22"
bytes = "1"
log = "0.4"
arc-swap = "1"
hashbrown = "0.17"
rand = "0.8"
linkme = "0.3"
walkdir = "2.5.0"
glob = "0.3"
slab = "0.4"
zip = { version = "4", optional = true }

ygopro-data.workspace = true
ygopro-core-wrapper.workspace = true
ygopro-handler.workspace = true
ygopro-derive.workspace = true

[build-dependencies]
semver = "1"
toml = "0.9"

[features]
default = ["zip", "card"]
zip = ["dep:zip"]
card = [
    "ygopro-core-wrapper/card",
    "ygopro-data/card",
]
koishi = ["ygopro-core-wrapper/koishi"]
ygomobile_support = []

[package.metadata]
ygopro-version = "1.36.2"
