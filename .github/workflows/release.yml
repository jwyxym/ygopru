name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux-x86_64
          - os: macos-15
            artifact: macos-aarch64
          - os: windows-latest
            artifact: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Extract cargo version
        id: version
        shell: bash
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "ygopro") | .version')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build release binary
        run: cargo build --release

      - name: Package
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            BIN="target/release/ygopro.exe"
            NAME="ygopro.exe"
          else
            BIN="target/release/ygopro"
            NAME="ygopro"
          fi
          cp "$BIN" "$NAME"
          tar -czf "ygopro-${{ steps.version.outputs.version }}-${{ matrix.artifact }}.tar.gz" "$NAME"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ygopro-${{ steps.version.outputs.version }}-${{ matrix.artifact }}
          path: "ygopro-${{ steps.version.outputs.version }}-${{ matrix.artifact }}.tar.gz"
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.tar.gz
