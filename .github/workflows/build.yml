name: Build native libraries

on:
  push:
    branches:
      - ygopro3

jobs:
  android:
    name: Android ${{ matrix.abi }} ${{ matrix.feature }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            feature: ygopro3_support
            target: aarch64-linux-android
            linker: aarch64-linux-android21-clang
            cc: aarch64-linux-android21-clang
            cxx: aarch64-linux-android21-clang++
            ar: llvm-ar
            output: libygoserver.so
          - abi: arm64-v8a
            feature: ygomobile_support
            target: aarch64-linux-android
            linker: aarch64-linux-android21-clang
            cc: aarch64-linux-android21-clang
            cxx: aarch64-linux-android21-clang++
            ar: llvm-ar
            output: libygoserver.so
          - abi: armeabi-v7a
            feature: ygopro3_support
            target: armv7-linux-androideabi
            linker: armv7a-linux-androideabi21-clang
            cc: armv7a-linux-androideabi21-clang
            cxx: armv7a-linux-androideabi21-clang++
            ar: llvm-ar
            output: libygoserver.so
          - abi: armeabi-v7a
            feature: ygomobile_support
            target: armv7-linux-androideabi
            linker: armv7a-linux-androideabi21-clang
            cc: armv7a-linux-androideabi21-clang
            cxx: armv7a-linux-androideabi21-clang++
            ar: llvm-ar
            output: libygoserver.so
          - abi: x86
            feature: ygopro3_support
            target: i686-linux-android
            linker: i686-linux-android21-clang
            cc: i686-linux-android21-clang
            cxx: i686-linux-android21-clang++
            ar: llvm-ar
            output: libygoserver.so
          - abi: x86
            feature: ygomobile_support
            target: i686-linux-android
            linker: i686-linux-android21-clang
            cc: i686-linux-android21-clang
            cxx: i686-linux-android21-clang++
            ar: llvm-ar
            output: libygoserver.so
          - abi: x86_64
            feature: ygopro3_support
            target: x86_64-linux-android
            linker: x86_64-linux-android21-clang
            cc: x86_64-linux-android21-clang
            cxx: x86_64-linux-android21-clang++
            ar: llvm-ar
            output: libygoserver.so
          - abi: x86_64
            feature: ygomobile_support
            target: x86_64-linux-android
            linker: x86_64-linux-android21-clang
            cc: x86_64-linux-android21-clang
            cxx: x86_64-linux-android21-clang++
            ar: llvm-ar
            output: libygoserver.so
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: true

      - name: Build
        run: |
          NDK_TOOLCHAIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          if [ ! -d "$NDK_TOOLCHAIN" ]; then
            NDK_TOOLCHAIN="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"
          fi
          echo "Using Android NDK toolchain: $NDK_TOOLCHAIN"
          ls "$NDK_TOOLCHAIN"/${{ matrix.cc }}

          export PATH="$NDK_TOOLCHAIN:$PATH"
          export CC="$NDK_TOOLCHAIN/${{ matrix.cc }}"
          export CXX="$NDK_TOOLCHAIN/${{ matrix.cxx }}"
          export AR="$NDK_TOOLCHAIN/${{ matrix.ar }}"
          export TARGET_CC="$CC"
          export TARGET_CXX="$CXX"
          export TARGET_AR="$AR"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$NDK_TOOLCHAIN/aarch64-linux-android21-clang"
          export CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER="$NDK_TOOLCHAIN/armv7a-linux-androideabi21-clang"
          export CARGO_TARGET_I686_LINUX_ANDROID_LINKER="$NDK_TOOLCHAIN/i686-linux-android21-clang"
          export CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER="$NDK_TOOLCHAIN/x86_64-linux-android21-clang"

          cargo build --release --lib -p ygoserver --target ${{ matrix.target }} --features ${{ matrix.feature }}

      - name: Package
        run: |
          mkdir -p dist/${{ matrix.feature }}/android/${{ matrix.abi }}
          cp target/${{ matrix.target }}/release/${{ matrix.output }} dist/${{ matrix.feature }}/android/${{ matrix.abi }}/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ygoserver-android-${{ matrix.abi }}(${{ matrix.feature }})
          path: dist/${{ matrix.feature }}/android/${{ matrix.abi }}/${{ matrix.output }}

  linux:
    name: Linux ${{ matrix.arch }} ${{ matrix.feature }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            feature: ygopro3_support
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - arch: arm64
            feature: ygopro3_support
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - name: Build
        run: cargo build --release --lib -p ygoserver --target ${{ matrix.target }} --features ${{ matrix.feature }}

      - name: Package
        run: |
          mkdir -p dist/${{ matrix.feature }}/linux-${{ matrix.arch }}
          cp target/${{ matrix.target }}/release/libygoserver.so dist/${{ matrix.feature }}/linux-${{ matrix.arch }}/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ygoserver-linux-${{ matrix.arch }}(${{ matrix.feature }})
          path: dist/${{ matrix.feature }}/linux-${{ matrix.arch }}/libygoserver.so

  windows:
    name: Windows ${{ matrix.arch }} ${{ matrix.feature }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            feature: ygopro3_support
            target: x86_64-pc-windows-msvc
          - arch: arm64
            feature: ygopro3_support
            target: aarch64-pc-windows-msvc
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - name: Build
        run: cargo build --release --lib -p ygoserver --target ${{ matrix.target }} --features ${{ matrix.feature }}

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/${{ matrix.feature }}/windows-${{ matrix.arch }} | Out-Null
          Copy-Item target/${{ matrix.target }}/release/ygoserver.dll dist/${{ matrix.feature }}/windows-${{ matrix.arch }}/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ygoserver-windows-${{ matrix.arch }}(${{ matrix.feature }})
          path: dist/${{ matrix.feature }}/windows-${{ matrix.arch }}/ygoserver.dll

  macos:
    name: macOS universal ${{ matrix.feature }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        feature:
          - ygopro3_support
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - name: Build x86_64
        run: cargo build --release --lib -p ygoserver --target x86_64-apple-darwin --features ${{ matrix.feature }}

      - name: Build arm64
        run: cargo build --release --lib -p ygoserver --target aarch64-apple-darwin --features ${{ matrix.feature }}

      - name: Package universal dylib
        run: |
          mkdir -p dist/${{ matrix.feature }}/macos-universal
          lipo -create \
            target/x86_64-apple-darwin/release/libygoserver.dylib \
            target/aarch64-apple-darwin/release/libygoserver.dylib \
            -output dist/${{ matrix.feature }}/macos-universal/libygoserver.dylib

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ygoserver-macos-universal(${{ matrix.feature }})
          path: dist/${{ matrix.feature }}/macos-universal/libygoserver.dylib

  create-release:
    needs: [android, windows, macos, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - feature: ygopro3
          - feature: ygomobile

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: build

      - name: Create release
        run: |
          cd build
          find . -maxdepth 1 -type d ! -name '*${{ matrix.feature }}*' ! -name '.' -exec rm -rf {} +
          find . -mindepth 1 -maxdepth 1 -type d | while read -r dir; do
            file=$(find "$dir" -maxdepth 1 -type f | head -n 1)
            [ -n "$file" ] || continue

            filename=$(basename "$file")
            dirname=$(basename "$dir")
            extension="${filename##*.}"

            if [ "$filename" != "$dirname" ]; then
              mv "$file" "$dir/$dirname.$extension"
            fi
          done
          gh release delete "${{ matrix.feature }}-latest" --cleanup-tag -y || true
          gh release create "${{ matrix.feature }}-latest" $(find . -type f) \
            --target "$GITHUB_SHA" \
            --title "${{ matrix.feature }}" \
            --notes "Latest build for ${{ matrix.feature }}" \
            --latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
