[package]
name = "ygopro-core-wrapper"
version = "0.1.1"
edition.workspace = true
license-file.workspace = true
repository.workspace = true
description = "Rust bindings to the YGOPro core (ocgcore) duel engine."
keywords = ["ygopro"]
readme = "README.md"
links = "ygopro-core"

[dependencies]
ygopro-data.workspace = true
rand = "0.8"
parking_lot = "0.12"
modular-bitfield = "0.13.1"

[build-dependencies]
cc = "1"
glob = "0.3"

[features]
default = ["official"]
official = []
koishi = []
custom = []
card = ["ygopro-data/card"]
