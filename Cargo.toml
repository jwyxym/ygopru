[package]
name = "ygopru"
version = "0.1.0"
edition = "2024"

[dependencies]
ygopro = { path = "./ygopro", default-features = false }
ygopro-data.workspace = true
ygopro-handler = { path = "./ygopro-handler", default-features = false }
ygopro-core-wrapper = { path = "./ygopro-core-wrapper", default-features = false }
ygopro-derive = { path = "./ygopro-derive" }
ygopro-external-server-bridge = { path = "./ygopro-external-server-bridge", default-features = false }

[workspace.dependencies]
ygopro-data = { path = "./ygopro-data", default-features = false }

[features]
default = [
    "zip",
    "card"
]
zip = ["ygopro/zip"]
card = [
    "ygopro/card",
    "ygopro-core-wrapper/card",
    "ygopro-data/card",
    "ygopro-external-server-bridge/card",
    "ygopro-handler/card",
]

[workspace]
default-members = ["ygoserver"]
resolver = "2"
members = [
    "ygopro-data",
    "ygopro-derive",
    "ygopro-core-wrapper",
    "ygopro-handler",
    "ygopro",
    "ygopro-toolkits",
    "ygopro-external-server-bridge",
    "ygoserver"
]

[profile.release]
lto = true
strip = true
opt-level = 'z'
